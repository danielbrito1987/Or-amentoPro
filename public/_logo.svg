<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="780" height="180">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077FF" />
      <stop offset="50%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#0047E6" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C8FF" />
      <stop offset="40%" stop-color="#3FA6FF" />
      <stop offset="100%" stop-color="#1478FF" />
    </linearGradient>

    <!-- PRO Badge Gradient -->
    <linearGradient id="proBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005BFF" />
      <stop offset="100%" stop-color="#0075FF" />
    </linearGradient>

    <filter id="shadowH" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003db3" flood-opacity="0.3" />
    </filter>

    <filter id="foldShadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="3" stdDeviation="3" flood-color="#002b80" flood-opacity="0.35" />
    </filter>

    <filter id="dShadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00247d" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Group: Icon (160x160 located at x=10, y=10) -->
  <g transform="translate(10, 10)">
    <!-- Main Body with Fold Cutout -->
    <path d="M 42 8 
             L 108 8 
             L 152 52 
             L 152 118 
             A 34 34 0 0 1 118 152 
             L 42 152 
             A 34 34 0 0 1 8 118 
             L 8 42 
             A 34 34 0 0 1 42 8 Z" 
          fill="url(#iconGradH)" 
          filter="url(#shadowH)" />

    <!-- Diagonal Long Shadow for Dollar Sign -->
    <path d="M 80 54 L 114 88 L 122 132 L 88 144 L 66 112 Z" 
          fill="#0035a8" 
          opacity="0.4" />

    <!-- Folded Corner Flap -->
    <path d="M 108 8 
             L 152 52 
             L 122 52 
             A 14 14 0 0 1 108 38 Z" 
          fill="url(#foldGradH)" 
          filter="url(#foldShadowH)" />

    <!-- Vertical Bar for $ -->
    <rect x="74" y="32" width="12" height="96" rx="6" fill="#FFFFFF" filter="url(#dShadowH)" />
    
    <!-- Dollar Body S -->
    <path d="M 104 60
             C 104 48, 93 41, 80 41
             C 67 41, 58 48, 58 59
             C 58 71, 68 76, 80 79
             L 84 80
             C 95 83, 102 88, 102 97
             C 102 108, 92 115, 79 115
             C 65 115, 55 107, 54 95
             L 66 94
             C 67 101, 71 104, 79 104
             C 87 104, 91 100, 91 95
             C 91 87, 83 83, 72 80
             C 60 77, 49 71, 49 59
             C 49 48, 59 36, 79 36
             C 94 36, 104 44, 106 57
             Z"
          fill="#FFFFFF"
          filter="url(#dShadowH)" />
  </g>

  <!-- Typography Text Group -->
  <!-- "Orça" in deep slate/black -->
  <text x="195" y="118" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="-1.5" 
        fill="#080F1E">Orça</text>

  <!-- "Fácil" in electric royal blue -->
  <text x="430" y="118" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="-1.5" 
        fill="#005BFF">Fácil</text>

  <!-- "PRO" Badge -->
  <g transform="translate(660, 48)">
    <rect x="0" y="0" width="112" height="66" rx="20" fill="url(#proBadgeGrad)" />
    <text x="56" y="47" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="1.5" 
          text-anchor="middle" 
          fill="#FFFFFF">PRO</text>
  </g>
</svg>
