<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="sqGradIcon" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#0055F6" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>

    <!-- Top-Right Fold Flap Gradient -->
    <linearGradient id="foldGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Under-Fold Shadow Gradient -->
    <linearGradient id="foldShadowGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a4d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#001a4d" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Shadow for Dollar Sign -->
    <filter id="dollarShadowIcon" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2" flood-color="#001438" flood-opacity="0.55" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="sqShadowIcon" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0055F6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#sqGradIcon)" filter="url(#sqShadowIcon)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="7" y="7" width="86" height="86" rx="21" ry="21" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Top-Right Page Fold Shadow -->
  <path d="M 68 7 L 68 34 Q 68 36 71 36 L 93 36 Z" fill="url(#foldShadowGradIcon)" />

  <!-- Top-Right Page Fold Flap -->
  <path d="M 68 7 L 68 33 Q 68 36 72 36 L 93 36 Q 87 19 68 7 Z" fill="url(#foldGradIcon)" />
  <path d="M 68 7 L 68 33 Q 68 36 72 36 L 93 36" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

  <!-- 3D Dollar Sign Symbol ($) -->
  <g filter="url(#dollarShadowIcon)">
    <!-- Central Vertical Bar -->
    <rect x="47" y="22" width="6" height="56" rx="3" fill="#FFFFFF" />

    <!-- Dollar S Path -->
    <path d="M 63 36 
             C 63 30, 58 27, 50 27 
             C 42 27, 37 31, 37 36 
             C 37 41, 41 44, 48 46 
             L 53 47 
             C 59 49, 63 51, 63 57 
             C 63 64, 57 68, 49 68 
             C 41 68, 36 63, 35 56 
             L 42 56 
             C 42 60, 45 63, 49 63 
             C 53 63, 57 61, 57 57 
             C 57 53, 53 51, 47 49 
             L 42 48 
             C 36 46, 31 43, 31 36 
             C 31 29, 37 23, 49 23 
             C 57 23, 62 27, 63 36 
             Z" fill="#FFFFFF" />
  </g>
</svg>
