<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 96" width="410" height="96" fill="none">
  <defs>
    <!-- Background Gradient for Squircle Icon -->
    <linearGradient id="sqGradW" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#0055F6" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>

    <!-- Top-Right Fold Flap Gradient -->
    <linearGradient id="foldGradW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Under-Fold Shadow Gradient -->
    <linearGradient id="foldShadowGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001438" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#001438" stop-opacity="0" />
    </linearGradient>

    <!-- PRO Badge Gradient -->
    <linearGradient id="proBadgeGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047E0" />
    </linearGradient>

    <!-- 3D Shadow for Dollar Sign -->
    <filter id="dollarShadowW" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2" flood-color="#001438" flood-opacity="0.5" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="sqShadowW" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0055F6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group for Official Icon -->
  <g transform="translate(4, 4)">
    <!-- Squircle Base with Shadow -->
    <rect x="4" y="4" width="80" height="80" rx="20" ry="20" fill="url(#sqGradW)" filter="url(#sqShadowW)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="5" y="5" width="78" height="78" rx="19" ry="19" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

    <!-- Top-Right Page Fold Shadow -->
    <path d="M 60 5 L 60 29 Q 60 31 63 31 L 83 31 Z" fill="url(#foldShadowGradW)" />

    <!-- Top-Right Page Fold Flap -->
    <path d="M 60 5 L 60 28 Q 60 31 64 31 L 83 31 Q 77 15 60 5 Z" fill="url(#foldGradW)" />
    <path d="M 60 5 L 60 28 Q 60 31 64 31 L 83 31" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

    <!-- 3D Dollar Sign Symbol ($) -->
    <g filter="url(#dollarShadowW)">
      <!-- Central Vertical Bar -->
      <rect x="41" y="19" width="5.5" height="50" rx="2.75" fill="#FFFFFF" />

      <!-- Dollar S Path -->
      <path d="M 56 31 
               C 56 26, 51 23, 44 23 
               C 37 23, 32 27, 32 31 
               C 32 36, 36 38, 42 40 
               L 47 41 
               C 52 43, 56 45, 56 50 
               C 56 56, 51 60, 43 60 
               C 36 60, 31 56, 30 50 
               L 37 50 
               C 37 53, 40 55, 44 55 
               C 47 55, 51 53, 51 50 
               C 51 46, 47 44, 42 43 
               L 37 41 
               C 32 40, 27 37, 27 31 
               C 27 25, 33 20, 43 20 
               C 50 20, 55 23, 56 31 
               Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: OrçaFácil PRO (White text for dark backgrounds) -->
  <g transform="translate(104, 61)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="-0.03em">
      <tspan fill="#FFFFFF">Orça</tspan><tspan fill="#38BDF8">Fácil</tspan>
    </text>

    <!-- PRO Pill Badge -->
    <g transform="translate(228, -32)">
      <rect x="0" y="0" width="62" height="26" rx="13" fill="url(#proBadgeGradW)" />
      <rect x="0" y="0" width="62" height="26" rx="13" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
      <text x="31" y="17.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="0.1em">PRO</text>
    </g>
  </g>
</svg>
