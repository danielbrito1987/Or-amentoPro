<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077FF" />
      <stop offset="50%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#0047E6" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C8FF" />
      <stop offset="40%" stop-color="#3FA6FF" />
      <stop offset="100%" stop-color="#1478FF" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#003db3" flood-opacity="0.35" />
    </filter>
    
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="4" stdDeviation="4" flood-color="#002b80" flood-opacity="0.4" />
    </filter>

    <filter id="dollarShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#00247d" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Main Body with Fold Cutout -->
  <path d="M 52 14 
           L 136 14 
           L 186 64 
           L 186 148 
           A 38 38 0 0 1 148 186 
           L 52 186 
           A 38 38 0 0 1 14 148 
           L 14 52 
           A 38 38 0 0 1 52 14 Z" 
        fill="url(#iconBgGrad)" 
        filter="url(#iconShadow)" />

  <!-- Diagonal Long Shadow for Dollar Sign -->
  <path d="M 100 68 L 138 106 L 146 160 L 108 174 L 84 135 Z" 
        fill="#003bb8" 
        opacity="0.45" />

  <!-- Folded Corner Flap -->
  <path d="M 136 14 
           L 186 64 
           L 150 64 
           A 14 14 0 0 1 136 50 Z" 
        fill="url(#foldGrad)" 
        filter="url(#foldShadow)" />

  <!-- Dollar Sign: Central Pillar and Loops -->
  <!-- Top and Bottom vertical ticks -->
  <rect x="94" y="44" width="12" height="112" rx="6" fill="#FFFFFF" filter="url(#dollarShadow)" />
  
  <!-- Stylized Dollar 'S' Body -->
  <path d="M 126 76
           C 126 62, 114 54, 100 54
           C 86 54, 76 62, 76 75
           C 76 89, 87 95, 101 98
           L 106 100
           C 118 103, 126 108, 126 119
           C 126 131, 115 140, 99 140
           C 83 140, 72 131, 71 117
           L 85 116
           C 86 124, 91 128, 99 128
           C 107 128, 113 124, 113 118
           C 113 108, 104 103, 91 100
           C 77 96, 64 90, 64 76
           C 64 63, 76 49, 99 49
           C 116 49, 128 58, 131 73
           Z"
        fill="#FFFFFF"
        filter="url(#dollarShadow)" />
</svg>
