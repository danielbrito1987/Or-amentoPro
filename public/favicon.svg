<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Royal Blue Gradient identical to the site (#2563EB / #3B82F6 / #1D4ED8) -->
    <linearGradient id="favSqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Folded Corner Flap Gradient -->
    <linearGradient id="favFoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>

    <!-- Glow for Browser Tabs -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle (Tile) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favSqGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" />

  <!-- Proposal Document Sheet -->
  <path d="M 14 13 L 36 13 L 46 23 L 46 49 C 46 51 44.5 52 42 52 L 14 52 C 11.5 52 10 51 10 49 L 10 16 C 10 14 11.5 13 14 13 Z" 
        fill="rgba(255,255,255,0.2)" 
        stroke="rgba(255,255,255,0.75)" 
        stroke-width="1.8" 
        stroke-linejoin="round" />

  <!-- Document Folded Flap -->
  <path d="M 36 13 L 36 23 L 46 23 Z" fill="url(#favFoldGrad)" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />

  <!-- Document Budget Value Lines (Bold for 16x16 / 32x32 Favicon Visibility) -->
  <line x1="16" y1="22" x2="31" y2="22" stroke="rgba(255,255,255,0.95)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="16" y1="28" x2="27" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="16" y1="34" x2="23" y2="34" stroke="rgba(255,255,255,0.6)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Dynamic Approved Checkmark Badge in Deep Royal Blue & Pure White -->
  <g transform="translate(28, 26)">
    <circle cx="14" cy="14" r="13" fill="#1D4ED8" />
    <circle cx="14" cy="14" r="11.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Ultra-Bold Crisp Checkmark -->
    <path d="M 8.5 14 L 12 17.5 L 19.5 9.5" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
