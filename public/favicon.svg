<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="sqGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#0055F6" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>

    <!-- Top-Right Fold Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Under-Fold Shadow Gradient -->
    <linearGradient id="foldShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a4d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#001a4d" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Shadow for Dollar Sign -->
    <filter id="dollarShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#001438" flood-opacity="0.6" />
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#001438" flood-opacity="0.3" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="sqShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0055F6" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="14" y="14" width="172" height="172" rx="42" ry="42" fill="url(#sqGrad)" filter="url(#sqShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="15" y="15" width="170" height="170" rx="41" ry="41" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Top-Right Page Fold Shadow -->
  <path d="M 136 15 L 136 68 Q 136 72 140 72 L 185 72 Z" fill="url(#foldShadowGrad)" />

  <!-- Top-Right Page Fold Flap -->
  <path d="M 136 15 L 136 65 Q 136 72 143 72 L 185 72 Q 174 38 136 15 Z" fill="url(#foldGrad)" />
  <!-- Fold Flap Edge Highlight -->
  <path d="M 136 15 L 136 65 Q 136 72 143 72 L 185 72" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- 3D Dollar Sign Symbol ($) -->
  <g filter="url(#dollarShadow)">
    <!-- Central Vertical Bar -->
    <rect x="94" y="46" width="12" height="108" rx="6" fill="#FFFFFF" />

    <!-- Dollar S Path -->
    <path d="M 126 73 
             C 126 62, 115 56, 100 56 
             C 85 56, 74 63, 74 74 
             C 74 84, 82 90, 95 93 
             L 106 96 
             C 118 99, 126 104, 126 115 
             C 126 128, 114 136, 99 136 
             C 82 136, 72 127, 71 113 
             L 84 113 
             C 85 121, 91 126, 99 126 
             C 107 126, 114 122, 114 115 
             C 114 107, 107 103, 94 99 
             L 84 96 
             C 73 93, 63 86, 63 74 
             C 63 60, 75 48, 99 48 
             C 115 48, 125 56, 126 73 
             Z" fill="#FFFFFF" />
  </g>
</svg>
