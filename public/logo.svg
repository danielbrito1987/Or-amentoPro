<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="sqGradH" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#0055F6" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>

    <!-- Top-Right Fold Flap Gradient -->
    <linearGradient id="foldGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Under-Fold Shadow Gradient -->
    <linearGradient id="foldShadowGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a4d" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#001a4d" stop-opacity="0" />
    </linearGradient>

    <!-- PRO Badge Gradient -->
    <linearGradient id="proBadgeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047E0" />
    </linearGradient>

    <!-- 3D Shadow for Dollar Sign -->
    <filter id="dollarShadowH" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3.5" stdDeviation="2" flood-color="#001438" flood-opacity="0.5" />
    </filter>

    <!-- Outer Squircle Shadow -->
    <filter id="sqShadowH" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0055F6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group for Icon (100x100 space, positioned at x=6, y=6) -->
  <g transform="translate(4, 5)">
    <!-- Squircle Base with Shadow -->
    <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#sqGradH)" filter="url(#sqShadowH)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="7" y="7" width="86" height="86" rx="21" ry="21" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

    <!-- Top-Right Page Fold Shadow -->
    <path d="M 68 7 L 68 34 Q 68 36 71 36 L 93 36 Z" fill="url(#foldShadowGradH)" />

    <!-- Top-Right Page Fold Flap -->
    <path d="M 68 7 L 68 33 Q 68 36 72 36 L 93 36 Q 87 19 68 7 Z" fill="url(#foldGradH)" />
    <path d="M 68 7 L 68 33 Q 68 36 72 36 L 93 36" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

    <!-- 3D Dollar Sign Symbol ($) -->
    <g filter="url(#dollarShadowH)">
      <!-- Central Vertical Bar -->
      <rect x="47" y="22" width="6" height="56" rx="3" fill="#FFFFFF" />

      <!-- Dollar S Path -->
      <path d="M 63 36 
               C 63 30, 58 27, 50 27 
               C 42 27, 37 31, 37 36 
               C 37 41, 41 44, 48 46 
               L 53 47 
               C 59 49, 63 51, 63 57 
               C 63 64, 57 68, 49 68 
               C 41 68, 36 63, 35 56 
               L 42 56 
               C 42 60, 45 63, 49 63 
               C 53 63, 57 61, 57 57 
               C 57 53, 53 51, 47 49 
               L 42 48 
               C 36 46, 31 43, 31 36 
               C 31 29, 37 23, 49 23 
               C 57 23, 62 27, 63 36 
               Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: OrçaFácil PRO -->
  <g transform="translate(112, 68)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.03em">
      <tspan fill="#0F172A">Orça</tspan><tspan fill="#0066FF">Fácil</tspan>
    </text>

    <!-- PRO Pill Badge -->
    <rect x="238" y="-32" width="60" height="26" rx="13" fill="url(#proBadgeGradH)" />
    <rect x="238" y="-32" width="60" height="26" rx="13" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
    <text x="268" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="0.1em">PRO</text>
  </g>
</svg>
