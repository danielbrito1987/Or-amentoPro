<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 54" width="295" height="54" fill="none">
  <defs>
    <!-- Master Site Blue Gradients (Matches Tailwind blue-600 / blue-500 / indigo-600) -->
    <linearGradient id="siteBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="facilBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="foldFlapGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>

    <!-- PRO Badge Gradient (Site signature: from-blue-600 to-indigo-600) -->
    <linearGradient id="badgeIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- High-Impact Blue Glow for Attention -->
    <filter id="iconBlueGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2563EB" flood-opacity="0.55" />
    </filter>

    <!-- Sharp Text Drop Shadow for Contrast -->
    <filter id="textShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="whiteGlyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E3A8A" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- ==================== ICON EMBLEM (Royal Blue Glow) ==================== -->
  <g transform="translate(3, 2)" filter="url(#iconBlueGlow)">
    <!-- Squircle Tile -->
    <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#siteBlueGrad)" />
    <!-- Glass Highlight Border -->
    <rect x="0.75" y="0.75" width="48.5" height="48.5" rx="13.25" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1.3" />

    <!-- Proposal Document Sheet with Folded Corner -->
    <path d="M 12 10 L 31 10 L 38 17 L 38 39.5 C 38 41 36.8 42 35 42 L 12 42 C 10.5 42 9.5 41 9.5 39.5 L 9.5 12.5 C 9.5 11 10.5 10 12 10 Z" 
          fill="rgba(255,255,255,0.18)" 
          stroke="rgba(255,255,255,0.6)" 
          stroke-width="1.3" 
          stroke-linejoin="round" />

    <!-- Folded Corner Flap -->
    <path d="M 31 10 L 31 17 L 38 17 Z" fill="url(#foldFlapGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="0.8" />

    <!-- Budget Calculation Lines -->
    <line x1="14" y1="17" x2="26" y2="17" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="22" x2="22" y2="22" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="27" x2="19" y2="27" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" />

    <!-- High-Impact Approval Checkmark in Pure White with Blue Shadow -->
    <g transform="translate(23, 21)" filter="url(#whiteGlyphShadow)">
      <!-- Circle Badge in Tailwind blue-600 -->
      <circle cx="12" cy="12" r="10.5" fill="#1D4ED8" />
      <circle cx="12" cy="12" r="9.5" fill="#2563EB" stroke="rgba(255,255,255,0.85)" stroke-width="1.2" />
      <!-- Crisp Checkmark -->
      <path d="M 7.5 12 L 10.5 15 L 16.5 8.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==================== LOGO TYPOGRAPHY ==================== -->
  <g transform="translate(65, 34)" filter="url(#textShadowDark)">
    <!-- Orça (Pure White) + Fácil (Tailwind Blue Gradient) -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="-0.035em">
      <tspan fill="#FFFFFF">Orça</tspan><tspan fill="url(#facilBlueGrad)">Fácil</tspan>
    </text>

    <!-- PRO Pill Badge (Blue-600 to Indigo-600) -->
    <g transform="translate(148, -23)">
      <rect x="0" y="0" width="48" height="22" rx="7" fill="url(#badgeIndigoGrad)" />
      <rect x="0" y="0" width="48" height="22" rx="7" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
      <text x="24" y="15.2" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="0.12em">PRO</text>
    </g>
  </g>

  <!-- Professional Subtitle in Slate 400 -->
  <text x="66" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="0.15em">SISTEMA DE ORÇAMENTOS</text>
</svg>
